name: False positive
description: MacScan flagged something that is safe
labels: [false positive]
body:
  - type: input
    id: item
    attributes:
      label: App or file
      placeholder: "/Applications/Example.app"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did it come from?
      placeholder: "Developer's website, Homebrew, App Store …"
  - type: textarea
    id: reason
    attributes:
      label: What did MacScan report?
      description: The severity and the reason shown in the details pane.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MacScan version
    validations:
      required: true
