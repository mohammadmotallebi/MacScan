name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test MacScanCore
        working-directory: Packages/MacScanCore
        # Skipped on CI only: timing checks that hosted runners are too slow for, and signer tests
        # that need a local keychain. They run locally with `swift test`.
        run: >
          swift test --skip
          "cancellationStopsClamscan|cancellationTerminatesChild|largestFoldersIsFastAndSkipsPackageInsides|selfSignedAppIsThreat|selfSignedExecutableIsThreat|waitsForAFileThatIsStillBeingWritten"
      - name: Build app (universal, unsigned)
        run: |
          xcodebuild -project MacScan.xcodeproj -scheme MacScan -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
